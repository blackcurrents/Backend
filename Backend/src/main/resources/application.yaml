spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: wasd

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  sql:
    init:
      mode: never

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  type-aliases-package: com.example.demo.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 9001
  servlet:
    context-path: /api

logging:
  level:
    com.example.demo: debug
    com.example.demo.mapper: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

jwt:
  secret: aGFyZHdvcmRzLWNvZGUtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZC0yMDI2MDYxMA==
  expiration: 86400000  # 24小时，单位毫秒

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.example.demo.controller

alipay:
  # 沙箱网关地址（固定）
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # 你的沙箱APPID
  app-id: 9021000164665552
  # 你的应用私钥
  app-private-key: 
  # 支付宝公钥
  alipay-public-key: 
  # 异步通知回调地址（需公网可访问）
  notify-url: http://frp-oil.com:15634/api/alipay/notify
  # 同步跳转地址（可选）
  return-url: http://localhost:5173/payment/result
  # 固定参数：返回格式、编码、签名类型
  format: JSON
  charset: UTF-8
  sign-type: RSA2